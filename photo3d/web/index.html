<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 위 '새 3D' 패널 + 아래 작업 목록, 뷰어는 전체 화면 오버레이. 현장 안전표지의 노랑을 강조색으로 */
:root{
  --bg:#f3f2ee; --panel:#ffffff; --ink:#1d1f22; --muted:#686c72; --line:#dcdad3;
  --accent:#f2b705; --accent-ink:#1d1f22; --ok:#2f7d4f; --run:#2563b8; --bad:#b3362c;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151719; --panel:#1f2226; --ink:#eceae4; --muted:#9aa0a6; --line:#33373c;
  --accent:#f2b705; --accent-ink:#151719; --ok:#5fbf86; --run:#6aa5ff; --bad:#ff7b6e; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#151719; --panel:#1f2226; --ink:#eceae4; --muted:#9aa0a6; --line:#33373c;
  --accent:#f2b705; --accent-ink:#151719; --ok:#5fbf86; --run:#6aa5ff; --bad:#ff7b6e; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
h1 b{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:3px}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:560px){.pick{grid-template-columns:1fr 1fr}}
.pickpc{margin:-2px 0 10px;font-size:13px}
.pick label{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--muted)}
.pick label strong{display:block;color:var(--ink);font-size:15px}
.pick input{display:none}
.samples{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:0 0 8px}
.samples button{font-size:13px;font-weight:500;padding:6px 10px}
.samples button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.chosen{font-size:13px;color:var(--muted);margin:4px 0 10px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.mode label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.mode label strong{display:block;color:var(--ink);font-size:14px}
.mode label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode input{accent-color:var(--accent);margin-top:3px}
details{margin:6px 0 12px;font-size:13px;color:var(--muted)}
details input{margin-top:6px;width:100%}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.msg{font-size:13px;margin-top:8px;min-height:1.2em}
.tip{font-size:13px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.lan{font-family:var(--mono);color:var(--ink)}
.list{display:grid;gap:10px;margin-top:22px}
.job{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px}
.job img,.job .ph{width:88px;height:66px;object-fit:cover;border-radius:6px;background:var(--line)}
.job .name{font-weight:600}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.meta .num{font-family:var(--mono)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.s-done{color:var(--ok)} .s-running,.s-queued{color:var(--run)} .s-failed{color:var(--bad)} .s-uploading{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button,.acts .btn{padding:6px 10px;font-size:13px}
.err{white-space:pre-wrap;font-family:var(--mono);font-size:12px;color:var(--bad);grid-column:1/-1;margin:0;
  max-height:120px;overflow:auto}
.empty{color:var(--muted);text-align:center;padding:30px}
.prog{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.steps li.done{color:var(--ink)} .steps li.cur{color:var(--ink);font-weight:600}
.ico{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;display:inline-grid;place-items:center;font-size:10px}
.done .ico{background:var(--ok);border-color:var(--ok);color:#fff}
.cur .ico{border-color:var(--line);border-top-color:var(--accent);border-right-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cur .ico{animation-duration:3s}}
.plog{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pel{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.pv{position:relative;height:180px;border-radius:8px;background:#0f1113;overflow:hidden}
.pv canvas{width:100%;height:100%;display:block}
.pv .cap{position:absolute;left:8px;bottom:6px;font-size:11.5px;color:#cfd3d8}
@media (max-width:560px){.prog{grid-template-columns:1fr}}
@media (max-width:560px){.job{grid-template-columns:64px 1fr}.job img,.job .ph{width:64px;height:48px}.acts{grid-column:1/-1;justify-content:flex-start}}
/* 뷰어 */
#viewer{position:fixed;inset:0;background:#101214;display:none;z-index:10}
#viewer.on{display:block}
#cv{width:100%;height:100%;display:block;touch-action:none}
.vbar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(#101214ee,#10121400);color:#eceae4}
.vbar .t{font-weight:600;margin-right:auto}
.vbar button,.vbar .btn{background:#1f2226;color:#eceae4;border-color:#3a3f45;padding:6px 10px;font-size:13px}
.vbar [hidden]{display:none}
.vbar button:disabled{opacity:.4}
.vbar button.on{background:var(--accent);color:#151719;border-color:var(--accent)}
.vinfo{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  color:#eceae4;font-size:13px;background:#1f2226dd;padding:8px 12px;border-radius:8px;max-width:calc(100% - 24px)}
.vinfo .d{font-family:var(--mono);font-size:18px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>현장 <b>3D</b></h1>
    <span class="sub">사진·영상으로 실측 3D 만들기 · 유니티 크레인 시뮬레이션용</span>
  </header>

  <section class="panel" aria-labelledby="newh">
    <h2 id="newh">새 3D 만들기</h2>
    <div class="row"><input id="name" type="text" placeholder="현장 이름 (예: 3공구 북측 옹벽)" autocomplete="off"></div>
    <div class="pick">
      <label for="files"><strong>파일 고르기</strong>사진·영상 여러 장</label>
      <input id="files" type="file" accept="image/*,video/*" multiple>
      <label for="folder"><strong>폴더 고르기</strong>폴더 안 사진 전부</label>
      <input id="folder" type="file" webkitdirectory directory multiple>
      <label for="cam"><strong>카메라로 찍기</strong>폰에서 바로 촬영</label>
      <input id="cam" type="file" accept="image/*,video/*" capture="environment" multiple>
    </div>
    <div class="pickpc" id="pickpc" hidden><button type="button" id="browse">PC 폴더 바로 쓰기 (올리기 없이 빠름)</button></div>
    <div class="samples" id="samples"></div>
    <div class="chosen" id="chosen">선택한 파일 없음 · 한쪽 면은 5~6장, 한 바퀴는 15~20장, 또는 1~2분 영상</div>
    <div class="mode" role="radiogroup" aria-label="품질">
      <label><input type="radio" name="mode" value="fast" checked><span><strong>빠르게</strong>약 4~6분 · 미리보기</span></label>
      <label><input type="radio" name="mode" value="best"><span><strong>최고 품질</strong>GPU 최대 · 15~30분</span></label>
    </div>
    <details><summary>PC 에 있는 폴더로 만들기 / 실측 크기 맞추기</summary>
      <input id="lpath" type="text" placeholder="PC 폴더 경로 (예: C:\photo3d\data\strecha\Benchmarking_Camera_Calibration_2008\castle-P30\images)">
      <input id="scale" type="text" placeholder="줄자 거리: 마커ID1,마커ID2,거리m (예: 0,3,10.25)">
      <input id="msize" type="text" placeholder="ArUco 마커 한 변 길이 m (예: 0.25)">
    </details>
    <div class="row"><button id="go" class="primary" disabled>3D 만들기</button></div>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="tip" id="tip"></div>
  </section>

  <div class="list" id="list" aria-live="polite"><div class="empty">불러오는 중…</div></div>
</div>

<div id="viewer" role="dialog" aria-label="3D 뷰어">
  <canvas id="cv"></canvas>
  <div class="vbar">
    <span class="t" id="vt"></span>
    <button id="splatb" aria-pressed="false" hidden>실사 보기</button>
    <button id="fillb" aria-pressed="false" hidden>구멍 메움</button>
    <button id="estb" aria-pressed="false" hidden>메운 곳 표시</button>
    <button id="measure" aria-pressed="false">거리 재기</button>
    <a class="btn" id="dl" download>GLB 내려받기</a>
    <button id="close">닫기</button>
  </div>
  <div class="vinfo" id="vinfo">끌어서 돌리기 · 휠/두 손가락으로 확대 · 오른쪽 끌기로 이동</div>
</div>

<script type="importmap">
{"imports":{"three":"/vendor/three.module.js",
 "three/addons/":"/vendor/addons/", "gsplat3d":"/vendor/gs/gaussian-splats-3d.module.js"}}
</script>
<script type="module">
// 3D 라이브러리는 '3D 보기'를 누를 때 불러온다 — 인터넷이 막혀도 목록·업로드는 동작
let THREE, GLTFLoader, OrbitControls;

const $ = (id) => document.getElementById(id);
const fmtT = (s) => s ? new Date(s * 1000).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const STATUS = {uploading:"올리는 중", queued:"대기", running:"처리 중", done:"완료", failed:"실패"};
let picked = [];

function setPicked(list) {
  picked = [...list];
  const mb = picked.reduce((a, f) => a + f.size, 0) / 1e6;
  $("chosen").textContent = picked.length ? `${picked.length}개 선택 · ${mb.toFixed(1)} MB` : "선택한 파일 없음";
  updateGo();
}
function updateGo(){ $("go").disabled = !(picked.length || $("lpath").value.trim()); }
$("files").onchange = (e) => setPicked(e.target.files);
$("cam").onchange = (e) => setPicked([...picked, ...e.target.files]);
const MEDIA_RE = /\.(jpe?g|png|heic|tiff?|webp|mp4|mov|m4v|avi|mkv)$/i;
$("folder").onchange = (e) => {   // 폴더 안(하위 폴더 포함)의 사진·영상만
  const fs = [...e.target.files].filter((f) => MEDIA_RE.test(f.name));
  if (!fs.length) { $("msg").textContent = "그 폴더에 사진·영상이 없습니다"; return; }
  const dir = (fs[0].webkitRelativePath || "").split("/")[0];
  if (dir && !$("name").value) $("name").value = dir;
  setPicked(fs);
};
// 이 PC 에서 연 경우: 윈도우 폴더 창으로 고르고 올리기 없이 바로 처리
if (["localhost", "127.0.0.1"].includes(location.hostname)) $("pickpc").hidden = false;
$("browse").onclick = async () => {
  $("browse").disabled = true; $("msg").textContent = "폴더 선택 창이 열렸습니다(작업표시줄을 확인하세요)";
  try {
    const d = await api("/api/browse", {method: "POST"});
    if (d.path) {
      $("lpath").value = d.path; sampleSel = null; setPicked([]);
      if (!$("name").value) $("name").value = d.name;
      $("chosen").textContent = `PC 폴더: ${d.path} (사진·영상 ${d.count}개)`;
      $("msg").textContent = ""; updateGo(); loadSamples();
    } else $("msg").textContent = "";
  } catch (e) { $("msg").textContent = "오류: " + e.message; }
  $("browse").disabled = false;
};
$("lpath").oninput = updateGo;

let sampleSel = null;
async function loadSamples() {
  const d = await api("/api/samples").catch(() => null); if (!d) return;
  const box = $("samples"); box.innerHTML = "";
  const lab = document.createElement("span"); lab.textContent = "예시 사진:"; box.append(lab);
  for (const sm of d.samples) {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = `${sm.name} · ${sm.desc}`; b.classList.toggle("on", sampleSel === sm.path);
    b.onclick = () => {
      sampleSel = sampleSel === sm.path ? null : sm.path;
      $("lpath").value = sampleSel || ""; if (sampleSel && !$("name").value) $("name").value = "예시 " + sm.name;
      if (!sampleSel && $("name").value === "예시 " + sm.name) $("name").value = "";
      $("chosen").textContent = sampleSel ? `예시 ${sm.name} (${sm.count}장) 선택 — 아래 버튼을 누르세요` : "선택한 파일 없음";
      updateGo(); loadSamples();
    };
    box.append(b);
  }
  const st = d.download.state;
  if (st === "running") { const s2 = document.createElement("span"); s2.textContent = d.download.msg; box.append(s2); setTimeout(loadSamples, 3000); }
  else if (d.samples.length < 7) {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = d.samples.length ? "예시 더 받기" : "예시 사진 받기";
    b.onclick = async () => { await api("/api/samples/download", {method: "POST"}); loadSamples(); };
    box.append(b);
    if (st === "failed") { const s2 = document.createElement("span"); s2.textContent = d.download.msg; box.append(s2); }
  }
}
loadSamples();

async function api(path, opt = {}) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

$("go").onclick = async () => {
  const btn = $("go"); btn.disabled = true; $("msg").textContent = "";
  if (sampleSel) picked = [];
  try {
    const sc = $("scale").value.trim();
    const job = await api("/api/jobs", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name: $("name").value || "현장", local_path: $("lpath").value.trim(),
        scale: sc ? sc + "\n" : null, mode: document.querySelector("input[name=mode]:checked").value, marker_size: parseFloat($("msize").value) || null})});
    const total = picked.reduce((a, f) => a + f.size, 0) || 1; let sent = 0;
    for (const [i, f] of picked.entries()) {
      $("msg").textContent = `올리는 중 ${i + 1}/${picked.length}: ${f.name}`;
      await new Promise((ok, bad) => {   // 진행률을 보려고 XHR 사용
        const x = new XMLHttpRequest();
        x.open("PUT", `/api/jobs/${job.id}/files?name=${encodeURIComponent(f.name)}`);
        x.upload.onprogress = (e) => { $("prog").style.width = ((sent + e.loaded) / total * 100) + "%"; };
        x.onload = () => x.status < 300 ? ok() : bad(new Error(JSON.parse(x.responseText || "{}").error || x.status));
        x.onerror = () => bad(new Error("업로드 실패 — 연결을 확인하세요"));
        x.send(f);
      });
      sent += f.size;
    }
    await api(`/api/jobs/${job.id}/start`, {method:"POST"});
    $("msg").textContent = "처리를 시작했습니다. 아래 목록에서 진행 상황을 볼 수 있습니다.";
    setPicked([]); $("files").value = ""; $("cam").value = ""; $("folder").value = ""; $("name").value = ""; $("lpath").value = ""; sampleSel = null; loadSamples();
    refresh();
  } catch (e) { $("msg").textContent = "오류: " + e.message; }
  $("prog").style.width = "0"; updateGo();
};

function card(j) {
  const el = document.createElement("div"); el.className = "job";
  const thumb = j.files || j.local_path || j.status === "done" ? `<img alt="" loading="lazy" src="/api/jobs/${j.id}/thumb?t=${j.status}">` : `<div class="ph"></div>`;
  const mins = j.finished && j.started ? ((j.finished - j.started) / 60).toFixed(1) + "분" : "";
  const size = j.size_m ? j.size_m.map((v) => v.toFixed(1)).join(" × ") : "";
  const unit = j.grade && j.grade.grade !== "D" ? "m" : "(임의 단위)";
  el.innerHTML = `${thumb}
    <div><div class="name"></div>
      <div class="meta"><span class="pill s-${j.status}">${STATUS[j.status] || j.status}</span>
        ${j.stage && j.status === "running" ? `<span>${j.stage}</span>` : ""}
        ${j.registered ? `<span>사진 <span class="num">${j.registered}</span> 연결</span>` : ""}
        ${size ? `<span>크기 <span class="num">${size}</span> ${unit}</span>` : ""}
        ${mins ? `<span class="num">${mins}</span>` : ""}
        <span>${fmtT(j.created)}</span></div></div>
    <div class="acts"></div>`;
  el.querySelector(".name").textContent = j.name;
  const acts = el.querySelector(".acts");
  if (j.has_model) {
    const b = document.createElement("button"); b.textContent = "3D 보기"; b.className = "primary";
    b.onclick = () => openViewer(j); acts.append(b);
  }
  if (j.has_report) {
    const a = document.createElement("a"); a.className = "btn"; a.textContent = "품질 보고서";
    a.href = `/files/${j.id}/quality_report.html`; a.target = "_blank"; a.rel = "noopener"; acts.append(a);
  }
  if (j.status === "failed") {
    const b = document.createElement("button"); b.textContent = "다시 처리";
    b.onclick = async () => { await api(`/api/jobs/${j.id}/start`, {method:"POST"}).catch((e) => alertMsg(e)); refresh(); };
    acts.append(b);
  }
  if (j.status !== "running") {
    const b = document.createElement("button"); b.textContent = "삭제";
    b.onclick = async () => { if (b.dataset.sure) { await api(`/api/jobs/${j.id}`, {method:"DELETE"}); refresh(); }
      else { b.dataset.sure = 1; b.textContent = "정말 삭제"; } };
    acts.append(b);
  }
  if (j.status === "running" || j.status === "queued") el.append(progress(j));
  if (j.status === "failed" && j.error) {
    const pre = document.createElement("pre"); pre.className = "err"; pre.textContent = j.error; el.append(pre);
  }
  return el;
}
function alertMsg(e){ $("msg").textContent = "오류: " + e.message; }

/* ── 처리 중 진행 표시: 단계(돌아가는 표시) + 경과 시간 + 회전하는 3D 점 미리보기 ── */
const STEPS = ["입력 정리", "카메라 위치 계산", "축척·좌표", "3D 생성(조밀·메쉬·색)", "유니티 파일", "구멍 메우기", "실사(스플래팅) 학습"];
const live = new Map();   // job id → {el, pv}
function progress(j) {
  let L = live.get(j.id);
  if (!L) {
    const el = document.createElement("div"); el.className = "prog";
    el.innerHTML = `<div><ol class="steps"></ol><div class="pel"></div><div class="plog"></div></div>
      <div class="pv"><canvas></canvas><div class="cap">카메라 위치를 계산하면 3D 점이 여기에 나타납니다</div></div>`;
    L = {el, pv: null, rev: null, started: j.started}; live.set(j.id, L);
  }
  L.started = j.started;
  const step = j.status === "queued" ? 0 : Math.max(1, j.step || 1);
  const steps = STEPS;
  L.el.querySelector(".steps").innerHTML = steps.map((t, i) => {
    const k = i + 1, cls = step > k ? "done" : step === k ? "cur" : "";
    return `<li class="${cls}"><span class="ico" aria-hidden="true">${step > k ? "✓" : ""}</span>${t}</li>`;
  }).join("");
  L.el.querySelector(".plog").textContent = j.status === "queued" ? "앞 작업이 끝나면 시작합니다" : (j.last_log || "");
  if (j.preview_rev && j.preview_rev !== L.rev) { L.rev = j.preview_rev; loadPreview(j.id, L); }
  return L.el;
}
setInterval(() => {   // 경과 시간은 1초마다
  for (const L of live.values()) if (L.started) {
    const s = Math.floor(Date.now() / 1000 - L.started);
    L.el.querySelector(".pel").textContent = `경과 ${Math.floor(s / 60)}분 ${String(s % 60).padStart(2, "0")}초`;
  }
}, 1000);
async function loadPreview(id, L) {
  try {
    const d = await api(`/api/jobs/${id}/preview`); if (!d.n) return;
    if (!THREE) { THREE = await import("three"); }
    if (!L.pv) {
      const cv = L.el.querySelector("canvas");
      const r = new THREE.WebGLRenderer({canvas: cv, antialias: true}); r.setPixelRatio(Math.min(devicePixelRatio, 2));
      const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, 0.01, 1e5), root = new THREE.Group();
      sc.add(root); L.pv = {r, sc, cam, root, a: 0};
      const tick = () => {
        if (!live.has(id)) { r.dispose(); return; }
        const w = cv.clientWidth, h = cv.clientHeight;
        if (w && (cv.width !== Math.floor(w * r.getPixelRatio()))) { r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
        L.pv.a += 0.004; root.rotation.y = L.pv.a; r.render(sc, cam); requestAnimationFrame(tick);
      };
      tick();
    }
    const {root, cam} = L.pv; root.clear();
    const n = d.n, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let c = [0, 0, 0];
    for (let i = 0; i < n; i++) { c[0] += d.xyz[3*i]; c[1] += d.xyz[3*i+1]; c[2] += d.xyz[3*i+2]; }
    c = c.map((v) => v / n);
    let rad = 0;
    for (let i = 0; i < n; i++) {   // Z-up(측량) → Y-up(화면), 중심을 원점으로
      const x = d.xyz[3*i] - c[0], y = d.xyz[3*i+1] - c[1], z = d.xyz[3*i+2] - c[2];
      pos[3*i] = x; pos[3*i+1] = z; pos[3*i+2] = -y; rad = Math.max(rad, Math.hypot(x, y, z) * 0.8);
      col[3*i] = d.rgb[3*i] / 255; col[3*i+1] = d.rgb[3*i+1] / 255; col[3*i+2] = d.rgb[3*i+2] / 255;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    root.add(new THREE.Points(g, new THREE.PointsMaterial({size: d.kind === "dense" ? rad / 250 : rad / 120, vertexColors: true})));
    if (d.cams.length) {   // 카메라 위치(노란 점)
      const cp = new Float32Array(d.cams.length * 3);
      d.cams.forEach((p, i) => { cp[3*i] = p[0] - c[0]; cp[3*i+1] = p[2] - c[2]; cp[3*i+2] = -(p[1] - c[1]); });
      const cg = new THREE.BufferGeometry(); cg.setAttribute("position", new THREE.BufferAttribute(cp, 3));
      root.add(new THREE.Points(cg, new THREE.PointsMaterial({size: rad / 40, color: 0xf2b705})));
    }
    cam.position.set(0, rad * 0.9, rad * 2.2); cam.lookAt(0, 0, 0);
    L.el.querySelector(".cap").textContent = d.kind === "dense"
      ? `조밀 점 ${n.toLocaleString()}개 · 다음: 메쉬·색`
      : `특징점 ${n.toLocaleString()}개 · 노란 점 = 사진 찍은 위치(${d.cams.length})`;
  } catch (e) { console.error(e); }
}

async function refresh() {
  try {
    const d = await api("/api/jobs");
    const list = $("list"); list.replaceChildren();
    if (!d.jobs.length) list.innerHTML = `<div class="empty">아직 만든 3D 가 없습니다. 위에서 사진이나 영상을 올려 보세요.</div>`;
    d.jobs.forEach((j) => list.append(card(j)));
    for (const id of [...live.keys()]) if (!d.jobs.some((j) => j.id === id && (j.status === "running" || j.status === "queued"))) live.delete(id);
    const lan = d.lan.length ? `같은 와이파이의 폰에서 접속: <span class="lan">${d.lan.join("  ")}</span>` : "";
    const gpu = d.tools.colmap ? "GPU(COLMAP) 사용" : "CPU 로 처리(느림)";
    $("tip").innerHTML = `${lan}${lan ? " · " : ""}${gpu}`;
  } catch (e) { $("list").innerHTML = `<div class="empty">앱 서버에 연결할 수 없습니다 — APP.bat 창이 켜져 있는지 확인하세요.</div>`; }
}
refresh(); setInterval(refresh, 3000);

/* ── 3D 뷰어 ── */
const cv = $("cv");
let renderer, scene, camera, controls, model = null, measuring = false, pts = [], marks, curJob = null, ray;
async function initViewer() {
  if (renderer) return;
  THREE = await import("three");
  ({ GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js"));
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x101214);
  camera = new THREE.PerspectiveCamera(50, 1, 0.01, 5000);
  controls = new OrbitControls(camera, cv); controls.enableDamping = true;
  marks = new THREE.Group(); scene.add(marks); ray = new THREE.Raycaster();
  addEventListener("resize", resize);
  (function loop(){ if ($("viewer").classList.contains("on")) { controls.update(); renderer.render(scene, camera); } requestAnimationFrame(loop); })();
}
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

async function openViewer(j) {
  curJob = j; $("viewer").classList.add("on");
  $("vinfo").textContent = "3D 뷰어 준비 중…";
  try { await initViewer(); } catch (e) { $("vinfo").textContent = "3D 뷰어를 불러오지 못했습니다. GLB 내려받기는 됩니다."; 
    $("dl").href = `/files/${j.id}/site_model.glb`; return; }
  resize();
  $("vt").textContent = j.name; $("dl").href = `/files/${j.id}/site_model.glb`;
  $("dl").setAttribute("download", `${j.name}.glb`);
  useFill = !!j.has_filled; showEst = false; useSplat = !!j.has_splat;
  $("fillb").hidden = !j.has_filled; $("estb").hidden = !j.has_est; $("splatb").hidden = !j.has_splat;
  syncToggles(); loadModel(true);
}
let useFill = false, showEst = false, estModel = null, useSplat = false, splatView = null;
function syncToggles(){
  $("splatb").classList.toggle("on", useSplat); $("splatb").setAttribute("aria-pressed", useSplat);
  $("fillb").disabled = useSplat; $("measure").disabled = useSplat;
  $("fillb").classList.toggle("on", useFill); $("fillb").setAttribute("aria-pressed", useFill);
  $("estb").classList.toggle("on", showEst); $("estb").setAttribute("aria-pressed", showEst);
  $("estb").disabled = !useFill || useSplat;
}
function basic(root){ root.traverse((o) => { if (o.isMesh) {   // 조명 없이 사진 색 그대로
  const m = o.material; o.material = new THREE.MeshBasicMaterial({map: m.map || null,
    vertexColors: !!o.geometry.attributes.color, side: THREE.DoubleSide}); } }); }
async function clearScene() {
  if (model) { scene.remove(model); model = null; } if (estModel) { scene.remove(estModel); estModel = null; }
  if (splatView) { scene.remove(splatView); try { await splatView.dispose(); } catch (e) {} splatView = null; }
  clearMarks();
}
async function loadSplat(frame) {
  await clearScene();
  $("vinfo").textContent = "실사(가우시안 스플래팅) 불러오는 중… 큰 파일은 수십 초 걸립니다";
  try {
    const GS = await import("gsplat3d");
    splatView = new GS.DropInViewer({sharedMemoryForWorkers: false, gpuAcceleratedSort: false, dynamicScene: false});
    // 스플랫은 Z-up(측량 좌표), 메쉬 GLB 는 Y-up → X축 -90° 회전으로 맞춘다
    await splatView.addSplatScene(`/files/${curJob.id}/site_splat.ply`,
      {rotation: [-Math.SQRT1_2, 0, 0, Math.SQRT1_2], showLoadingUI: false, splatAlphaRemovalThreshold: 5,
       format: GS.SceneFormat.Ply});
    scene.add(splatView);
    if (frame) await frameFrom("site_model.glb");
    $("vinfo").textContent = "실사 보기(가우시안 스플래팅) · 거리 재기는 '실사 보기'를 끄고 메쉬에서";
  } catch (e) { console.error(e); $("vinfo").textContent = "실사 파일을 불러오지 못했습니다 → 메쉬로 봅니다"; useSplat = false; syncToggles(); loadModel(frame); }
}
function frameFrom(file) {   // 카메라 위치는 메쉬 범위로 잡는다
  return new Promise((res) => new GLTFLoader().load(`/files/${curJob.id}/${file}`, (g) => { frameBox(new THREE.Box3().setFromObject(g.scene)); res(); }, undefined, () => res()));
}
function frameBox(box) {
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0, s * 0.25, s * 0.75));
  camera.near = s / 1000; camera.far = s * 20; camera.updateProjectionMatrix();
}
async function loadModel(frame) {
  if (useSplat) return loadSplat(frame);
  const j = curJob, file = useFill ? "site_filled.glb" : "site_model.glb";
  $("vinfo").textContent = "불러오는 중…";
  await clearScene();
  new GLTFLoader().load(`/files/${j.id}/${file}`, (g) => {
    model = g.scene; basic(model); scene.add(model);
    if (frame) frameBox(new THREE.Box3().setFromObject(model));
    $("vinfo").textContent = useFill ? "구멍을 주변 형상으로 메운 모델 · '메운 곳 표시'로 측정 안 된 부분 확인"
                                     : "끌어서 돌리기 · 휠/두 손가락으로 확대 · 오른쪽 끌기로 이동";
    if (useFill && showEst) loadEst();
  }, undefined, () => { $("vinfo").textContent = "3D 파일을 불러오지 못했습니다."; });
}
function loadEst() {
  new GLTFLoader().load(`/files/${curJob.id}/site_estimated.glb`, (g) => {
    estModel = g.scene;
    estModel.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({color: 0xff7a00,
      transparent: true, opacity: 0.6, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2}); });
    scene.add(estModel);
    $("vinfo").textContent = "주황 = 사진에 안 찍혀 주변 형상으로 메운 곳(측정값 아님)";
  });
}
$("splatb").onclick = () => { useSplat = !useSplat; if (useSplat) { showEst = false; setMeasure(false); } syncToggles(); loadModel(false); };
$("fillb").onclick = () => { useFill = !useFill; if (!useFill) showEst = false; syncToggles(); loadModel(false); };
$("estb").onclick = () => { showEst = !showEst; syncToggles();
  if (showEst) loadEst(); else if (estModel) { scene.remove(estModel); estModel = null; } };
$("close").onclick = () => { $("viewer").classList.remove("on"); measuring = false; setMeasure(false); };
addEventListener("keydown", (e) => { if (e.key === "Escape") $("close").click(); });

function setMeasure(on){ measuring = on; $("measure").classList.toggle("on", on); $("measure").setAttribute("aria-pressed", on);
  if (on) { clearMarks(); $("vinfo").textContent = "재고 싶은 두 지점을 차례로 누르세요"; } }
$("measure").onclick = () => setMeasure(!measuring);
function clearMarks(){ if (marks) marks.clear(); pts = []; }

let downAt = null;
cv.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
cv.addEventListener("pointerup", (e) => {
  if (!measuring || !model || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = cv.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObject(model, true)[0]; if (!hit) return;
  if (pts.length === 2) clearMarks();
  pts.push(hit.point.clone());
  const size = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).length() / 200;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(size), new THREE.MeshBasicMaterial({color: 0xf2b705, depthTest: false}));
  dot.position.copy(hit.point); dot.renderOrder = 2; marks.add(dot);
  if (pts.length === 2) {
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: 0xf2b705, depthTest: false}));
    line.renderOrder = 2; marks.add(line);
    const d = pts[0].distanceTo(pts[1]);
    const metric = curJob && curJob.grade && curJob.grade.grade !== "D";
    $("vinfo").innerHTML = `거리 <span class="d">${d.toFixed(3)}</span> ${metric ? "m" : "(임의 단위 — 줄자 거리나 마커를 넣으면 m)"}`;
  } else $("vinfo").textContent = "두 번째 지점을 누르세요";
});
</script>
